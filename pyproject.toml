[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-foundry"
version = "0.1.0"
description = "A modular, extensible RAG evaluation and experimentation framework."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "RAG Foundry Maintainers", email = "hello@ragfoundry.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "typer[all]>=0.9.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "pyyaml>=6.0",
  "numpy>=1.24.0",
  "sentence-transformers>=2.2.2",
  "faiss-cpu>=1.7.4",
  "openai>=1.0.0",
  "tenacity>=8.2.0",
  "rich>=13.0.0",
  "jinja2>=3.1.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "black>=23.7.0",
  "ruff>=0.1.0",
  "httpx>=0.24.0",
]

[project.scripts]
rag-foundry = "rag_foundry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_foundry"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=rag_foundry"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]
