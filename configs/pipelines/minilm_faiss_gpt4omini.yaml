pipeline_id: "minilm_faiss_gpt4omini"

retriever:
  type: "faiss"
  embedding:
    provider: "sentence-transformers"
    model_name: "all-MiniLM-L6-v2"
  index_path: "storage/index.faiss"
  top_k: 3

generator:
  type: "openai_chat"
  model: "gpt-4o-mini"
  max_tokens: 256
  temperature: 0.1

prompt_template: |
  You are a helpful assistant. Answer the question based ONLY on the context.

  Context:
  {{context}}

  Question: {{question}}
